[package]
name = "kova-app"
version = "1.5.0"
edition = "2021"
description = "KOVA V1 launcher app (Tauri) by Avok Interactive."
license = "MIT"
publish = false

[lib]
name = "kova_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
kova-core = { path = "../../crates/kova-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
# KOVA LIVE Phase 1: HTTP + websocket + OS credential store. All
# rustls (pure Rust TLS) — no system TLS, so the Windows cross-check
# needs no native libraries. reqwest blocking: the LIVE commands are
# sync Tauri commands, no tokio dependency in this crate.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
keyring = "4"
